<!--Design a webpage using tables and include multimedia elements like audio, video, and iframe.-->
<!DOCTYPE html>
<html lang="en">

<body>
    <table align="center" border="2">
        <th>Multimedia Elements</th>
       <tr>
        <td>Audio</td>
        <td><audio src="sample.mp3" controls>Play Audio</audio>   </td>
        </tr>
        <tr>
        <td>Video</td>
        <td><video src="videosample.mp4" controls width="320" height="180"   </td>
        </tr>
        <tr>
        <td>iframe</td>
        <td><iframe src="https://www.google.com/maps/embed?..."
        width="300" 
        height="225"  
        >
        </iframe>
        </td>
        </tr>
    </table>


</body>

</html>
